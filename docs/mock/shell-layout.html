<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tavi — shell layout, built from the real components</title>
    <style>
      /* Only the mock's own scaffolding lives here. Everything you can see that
         looks like the app is a real component imported from /src — the Tailwind
         build, the tokens and the markup all come from the project. */
      html, body { height: 100%; }
      body { margin: 0; overflow: hidden; }

      .mock-main { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
      .mock-body { display: flex; flex: 1; min-height: 0; }
      .mock-col  { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }

      /* One height for both top bars, so the rail's header and the app bar read
         as a single strip instead of two slabs of different thickness. */
      .mock-bar { height: 36px; }
      .mock-bar-row {
        display: flex; align-items: center; gap: 2px;
        height: 36px; padding-inline: 8px 8px;
        /* clears the fixed toggle, which sits over this corner either way */
        padding-left: 38px;
      }
      .mock-appbar {
        display: flex; align-items: center; gap: 8px; flex: none;
        height: 36px; padding: 0 10px; border-bottom: 1px solid var(--color-border);
      }
      /* ThemeToggle and KeySettings size themselves internally and take no
         size prop, so they are pinned here to the same 24px as every other
         icon in the bar. Two selectors beat the single-class utility. */
      .mock-appbar > button,
      .mock-appbar [data-slot='tooltip-trigger'] > button { width: 24px; height: 24px; }
      /* …and the glyph inside them, so the bars draw at one optical weight.
         icon-xs is a 12px glyph; ThemeToggle and KeySettings hardcode 16px. */
      .mock-appbar button > svg { width: 12px; height: 12px; }
      .mock-appbar .grow { flex: 1; }
      /* The single sidebar toggle. Fixed above the rail, so it is the same
         control in the same place whether the rail is open or closed. */
      .mock-rail-toggle { position: fixed; top: 6px; left: 8px; z-index: 70; }
      .mock-title { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mock-dim { color: var(--color-muted-foreground); font-size: 12px; }

      /* The workspace column. The transcript and the composer are siblings
         here, each centring itself, because that is how the app stacks them:
         the thread is a flex-1 scroller across the full width and the composer
         is a max-w-3xl strip under it. Wrapping both in one shared column was
         a mock-only idea, and it quietly changed the thread's width — the
         message column came out 64px narrower than the app's and sat inside
         the composer's padding.

         Opening the rail narrows this column and both children follow it. It is
         never centred on the whole window. */
      .mock-outro { flex: 1; }

      .mock-dot { width: 6px; height: 6px; border-radius: 999px; flex: none; background: var(--color-muted-foreground); opacity: 0.45; }
      .mock-dot.on { background: var(--color-success); opacity: 1; }

      /* Rail row geometry. The reference draws a pill that grows to hold its
         label, the way macOS toolbars do, rather than a square icon button. */
      .mock-pill { height: 2rem !important; gap: 0.6rem !important; padding-inline: 0.55rem !important; }
      .mock-pill-icon { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 1.05rem; }
      .mock-pill-icon svg { width: 1rem; height: 1rem; }
      .mock-pill-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* SidebarMenuBadge is absolutely positioned over the right end of the row,
         which is what it is for: a timestamp that pushes the row's button
         around changes the row's hit area as the title changes length. The
         label has to stop short of it or a long title runs underneath and is
         sliced off mid-word instead of ellipsising. The badge is at most ~30px
         wide, so 44px of end padding clears it with room to spare. */
      .mock-pill-timed { padding-inline-end: 2.75rem !important; }
      .mock-pill-key { margin-left: auto; opacity: 0; transition: opacity 120ms; }
      .mock-pill:hover .mock-pill-key { opacity: 0.6; }
      .mock-hollow { flex: none; width: 0.5rem; height: 0.5rem; border-radius: 999px; border: 1px solid var(--color-muted-foreground); opacity: 0.55; }
      /* A row that currently does nothing, because there is nothing to leave. */
      .mock-dim-row { opacity: 0.45; }
      .mock-foot-btn { display: flex; width: 100%; align-items: center; gap: 0.4rem; border-radius: 0.375rem; padding: 0.35rem 0.5rem; text-align: left; }
      .mock-foot-btn:hover { background: var(--color-sidebar-accent); color: var(--color-sidebar-accent-foreground); }
      .mock-row-btn {
        display: flex; width: 100%; align-items: center; gap: 0.5rem;
        border-radius: 0.5rem; padding: 0.45rem 0.5rem;
      }
      .mock-row-btn:hover { background: var(--color-accent); }
      .mock-row-btn .name { flex: 1; text-align: left; font-size: 0.875rem; }
      .mock-row-btn .order { display: flex; gap: 2px; }

      .mock-scrim { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / 0.45); display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; }
      .mock-palette { width: min(560px, 90vw); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      /* ------------------------------------------------------------------
       * This file mounts the project's own components. Nothing in src/ is
       * modified, imported-by-alias, or stubbed — the paths below are the
       * same modules the real app uses, loaded through Vite.
       *
       * Requires the dev server: `pnpm dev`, then open
       * http://localhost:1420/docs/mock/shell-layout.html
       * ------------------------------------------------------------------ */
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import '/src/index.css'

      import {
        ArrowDownIcon,
        ArrowLeftIcon,
        ArrowRightIcon,
        ArrowUpIcon,
        ChevronDownIcon,
        CircleAlertIcon,
        ClockIcon,
        CodeIcon,
        CodeXmlIcon,
        CommandIcon,
        FileTextIcon,
        FolderIcon,
        FolderOpenIcon,
        FolderTreeIcon,
        GitBranchIcon,
        GripVerticalIcon,
        KeyRoundIcon,
        LightbulbIcon,
        ListChecksIcon,
        MenuIcon,
        MessageCircleIcon,
        LaptopIcon,
        TerminalIcon,
        CloudIcon,
        HistoryIcon,
        PanelRightIcon,
        PencilIcon,
        PlusIcon,
        SettingsIcon,
        SlidersHorizontalIcon,
        SquarePenIcon,
        SquareStackIcon,
        Trash2Icon,
        WorkflowIcon,
        ZapIcon,
        BugIcon,
        InfoIcon,
      } from 'lucide-react'

      import { Avatar, AvatarFallback } from '/src/components/avatar'

      import { Button } from '/src/components/button'
      import { Kbd } from '/src/components/kbd'
      import { Badge } from '/src/components/badge'
      import { Separator } from '/src/components/separator'
      import { ScrollArea } from '/src/components/scroll-area'
      import { Spinner } from '/src/components/spinner'
      import { Switch } from '/src/components/switch'
      import { Input } from '/src/components/input'
      import { Tooltip, TooltipTrigger, TooltipContent } from '/src/components/tooltip'
      import {
        DropdownMenu, DropdownMenuContent, DropdownMenuItem, DropdownMenuLabel, DropdownMenuSeparator,
        DropdownMenuShortcut, DropdownMenuTrigger,
      } from '/src/components/dropdown-menu'
      import { Empty, EmptyHeader, EmptyMedia, EmptyTitle, EmptyDescription } from '/src/components/empty'
      import { ToggleGroup, ToggleGroupItem } from '/src/components/toggle-group'
      import {
        Popover, PopoverTrigger, PopoverContent, PopoverHeader, PopoverTitle, PopoverDescription,
      } from '/src/components/popover'
      import {
        Dialog, DialogContent, DialogHeader, DialogTitle, DialogDescription, DialogBody, DialogFooter, DialogClose,
      } from '/src/components/dialog'
      import {
        Command, CommandInput, CommandList, CommandGroup, CommandItem, CommandShortcut, CommandSeparator,
      } from '/src/components/command'
      import {
        SidebarProvider, Sidebar, SidebarInset, SidebarTrigger, SidebarHeader, SidebarContent,
        SidebarFooter, SidebarInput, SidebarGroup, SidebarGroupLabel, SidebarGroupContent,
        SidebarMenu, SidebarMenuItem, SidebarMenuButton, SidebarMenuBadge,
      } from '/src/components/sidebar'
      import { Message, MessageContent } from '/src/components/message'
      import { Bubble, BubbleContent } from '/src/components/bubble'
      import {
        MessageScroller, MessageScrollerProvider, MessageScrollerViewport, MessageScrollerContent,
        MessageScrollerItem, MessageScrollerButton,
      } from '/src/components/message-scroller'

      /* The two controls that are written but currently unreachable, mounted
         here exactly as the real shell would mount them. */
      import { ThemeToggle } from '/src/components/theme-toggle'
      import { KeySettings } from '/src/components/key-settings'

      /* The real composer block, not a picture of one. */
      import {
        PromptInput, PromptInputBody, PromptInputTextarea, PromptInputActions,
        PromptInputSubmit, PromptInputAttachments, PromptInputTools, PromptInputQueue,
      } from '/src/blocks/prompt-input/prompt-input'
      import {
        PromptInputInset, PromptInputFooter, PromptInputMeta, PromptInputSelect,
        PromptInputModel, PromptInputContextUsage, PromptInputSuggestions,
        PromptInputMeter, PromptInputDictation,
      } from '/src/blocks/prompt-input/prompt-controls'
      import { PromptInputMenu } from '/src/blocks/prompt-input/prompt-menu'
      import { duration, easeOut, prefersReducedMotion } from '/src/lib/motion'
      import { AnimatePresence, MotionConfig, motion } from 'motion/react'

      /* No JSX in a plain HTML entry, so every element is built with
         React.createElement directly. A `tag('div') => (props, ...kids) => ...`
         helper looks tidier and is a trap: React calls a function component with
         a second argument, so the rest parameter swallows that `undefined` as if
         it were a child and React then overwrites props.children with it. Every
         child of that element silently disappears. */
      const h = React.createElement
      const useState = React.useState

      /* ---------------------------------------------------------------- placeholder data */
      const MODELS = [
        { value: 'vendor/model-a', label: 'Model name' },
        { value: 'vendor/model-b', label: 'Another model' },
        { value: 'vendor/model-c', label: 'Third model' },
      ]
      const LEVELS = [
        { value: 'none', label: 'None' },
        { value: 'low', label: 'Low' },
        { value: 'medium', label: 'Medium' },
        { value: 'high', label: 'High' },
        { value: 'xhigh', label: 'Extra high' },
        { value: 'max', label: 'Max' },
      ]
      const MODES = [
        { value: 'edit', label: 'Edit', icon: h(CodeIcon), description: 'Proposes file edits and commands', placeholder: 'Describe a change to make' },
        { value: 'plan', label: 'Plan', icon: h(ListChecksIcon), description: 'Investigates, then proposes steps', placeholder: 'What should we plan?' },
        { value: 'ask', label: 'Ask', icon: h(MessageCircleIcon), description: 'Answers without editing anything', placeholder: 'Ask about the codebase' },
      ]
      /* The composer placeholder follows the mode, the way the app does it. */
      const PLACEHOLDERS = Object.fromEntries(MODES.map((m) => [m.value, m.placeholder]))
      const FOLDERS = [
        { value: 'tavi', label: 'tavi', icon: h(FolderTreeIcon) },
        { value: 'scratch', label: 'scratch', icon: h(FolderTreeIcon) },
      ]
      /* Only Local is selectable. SSH and Cloud are listed and refused, the way
         the app lists them, rather than hidden — a picker that quietly omits
         what it cannot do reads as "there is no such thing". */
      const ENVIRONMENTS = [
        { value: 'ssh', label: 'SSH', icon: h(TerminalIcon), description: 'Not built yet — there is no remote transport', disabled: true },
        { value: 'cloud', label: 'Cloud', icon: h(CloudIcon), description: 'Not built yet — there is no hosted backend', disabled: true },
        { value: 'local', label: 'Local', icon: h(LaptopIcon), description: 'Files on this machine' },
      ]
      const ENVIRONMENT = 'local'
      const FOLDER_SOURCE = { local: { label: 'Folder', placeholder: 'Choose folder' } }
      const COMMANDS = [
        { value: 'explain', label: 'explain', description: 'Walk through code step by step', icon: h(LightbulbIcon), insert: 'explain ' },
        { value: 'fix', label: 'fix', description: 'Find the cause and propose a minimal fix', icon: h(BugIcon), insert: 'find the cause and propose the smallest fix: ' },
        { value: 'test', label: 'test', description: 'Write tests covering the given code', icon: h(ListChecksIcon), insert: 'write tests that cover this: ' },
        { value: 'plan', label: 'plan', description: 'Break the work into ordered steps', icon: h(ListChecksIcon), insert: 'plan the steps to ' },
      ]
      const FILES = [
        { value: 'server/chat.ts', label: 'chat.ts', hint: 'server', icon: h(FileTextIcon) },
        { value: 'server/models.ts', label: 'models.ts', hint: 'server', icon: h(FileTextIcon) },
        { value: 'src/App.tsx', label: 'App.tsx', hint: 'src', icon: h(FileTextIcon) },
        { value: 'src/blocks/prompt-input/prompt-block.tsx', label: 'prompt-block.tsx', hint: 'src/blocks/prompt-input', icon: h(FileTextIcon) },
        { value: 'README.md', label: 'README.md', icon: h(FileTextIcon) },
      ]
      /* Chat and Code are two products sharing one window, so the rail is two
         rails. Every row, every session and the account row belong to the mode
         that is selected — the sets are separate objects, not one list filtered
         by mode. Icons follow the reference: plus for New, folder, the graph
         glyph for Artifacts, lightning for Routines, clock for Scheduled. */
      const RAIL_SETS = {
        chat: {
          label: 'Chat',
          items: {
            projects: { label: 'Projects', icon: FolderIcon },
            artifacts: { label: 'Artifacts', icon: WorkflowIcon },
            scheduled: { label: 'Scheduled', icon: ClockIcon },
          },
          order: ['projects', 'artifacts', 'scheduled'],
          sessions: [
            { title: 'Greeting', when: 'now', active: true, running: true },
            { title: 'Blue team spy master', when: '4m' },
            { title: 'Greeting', when: '12m' },
            { title: 'Mesopotamian number sense', when: '1h' },
            { title: 'Creating a child-friendly explainer', when: '2h' },
            { title: 'MeshPilot project context', when: '5h' },
            { title: 'Greeting', when: '8h' },
          ],
          account: { name: 'Tavi', badge: 'local' },
        },
        code: {
          label: 'Code',
          items: {
            artifacts: { label: 'Artifacts', icon: WorkflowIcon },
            routines: { label: 'Routines', icon: ZapIcon },
            scheduled: { label: 'Scheduled', icon: ClockIcon },
          },
          order: ['artifacts', 'routines', 'scheduled'],
          sessions: [
            { title: 'Streaming path trace', when: 'now', active: true, running: true },
            { title: 'Effort levels per model', when: '2m' },
            { title: 'Why the key lives in Rust', when: '18m' },
            { title: 'Composer layout pass', when: '1d' },
            { title: 'Tool budget on the free tier', when: '1d' },
            { title: 'Storage layout notes', when: '4d' },
          ],
          account: { name: 'tavi', badge: 'main' },
        },
      }
      const DEFAULT_RAIL_STATE = {
        chat: { order: RAIL_SETS.chat.order, show: { projects: true, artifacts: true, scheduled: true, recents: true, footer: true } },
        code: { order: RAIL_SETS.code.order, show: { artifacts: true, routines: true, scheduled: true, recents: true, footer: true } },
      }

      /* ---------------------------------------------------------------- rail */
      /* Truncates a session name for a tooltip without the middle turning to
         mush: "Mesopotamian num…". */
      const navLabel = (title) =>
        !title ? '' : title.length > 22 ? `${title.slice(0, 21)}…` : title

      /* Row shape mirrors the reference: a pill that owns the leading icon and
         grows to hold its label, which is how SidebarMenuButton already draws.
         `mock-pill` is the only styling this file adds. */
      function RailRow({ icon, label, shortcut, active, onClick, dim }) {
        return h(
          SidebarMenuItem,
          null,
          h(
            SidebarMenuButton,
            {
              size: 'lg',
              isActive: Boolean(active),
              onClick,
              className: 'mock-pill' + (dim ? ' mock-dim-row' : ''),
            },
            h('span', { className: 'mock-pill-icon' }, h(icon)),
            h('span', { className: 'mock-pill-label' }, label),
            shortcut ? h('span', { className: 'mock-pill-key' }, h(Kbd, null, shortcut)) : null,
          ),
        )
      }

      /* Customize is a panel anchored to the row that opens it, not a centred
         dialog — the reference puts it right beside the button. It edits the
         current mode's rail only, because Chat and Code have separate rails. */
      function CustomizePanel({ set, state, toggle, move, footer }) {
        return h(
          PopoverContent,
          { side: 'right', align: 'start', sideOffset: 6, className: 'w-72 p-0' },
          h(
            PopoverHeader,
            { className: 'border-b border-border px-3 py-2.5' },
            h(PopoverTitle, { className: 'text-sm' }, `Customize ${set.label} sidebar`),
            h(PopoverDescription, { className: 'text-xs' }, 'Hide rows you do not use, or move them up.'),
          ),
          h(
            'div',
            { className: 'flex flex-col gap-0.5 p-2' },
            state.order.map((id, index) =>
              h(
                'div',
                { key: id, className: 'mock-row-btn' },
                h(GripVerticalIcon, { className: 'size-4 shrink-0 opacity-40' }),
                h('span', { className: 'name' }, set.items[id].label),
                h(
                  'span',
                  { className: 'order' },
                  h(
                    Button,
                    {
                      variant: 'ghost',
                      size: 'icon-xs',
                      'aria-label': `Move ${set.items[id].label} up`,
                      disabled: index === 0,
                      onClick: () => move(id, -1),
                    },
                    h(ArrowUpIcon),
                  ),
                  h(
                    Button,
                    {
                      variant: 'ghost',
                      size: 'icon-xs',
                      'aria-label': `Move ${set.items[id].label} down`,
                      disabled: index === state.order.length - 1,
                      onClick: () => move(id, 1),
                    },
                    h(ArrowDownIcon),
                  ),
                  h(Switch, { checked: state.show[id], onCheckedChange: (value) => toggle(id, value) }),
                ),
              ),
            ),
            h(Separator, { className: 'my-1' }),
            ...['recents', 'footer'].map((id) =>
              h(
                'div',
                { key: id, className: 'mock-row-btn' },
                h(GripVerticalIcon, { className: 'size-4 shrink-0 opacity-40' }),
                h('span', { className: 'name' }, id === 'recents' ? 'Recents' : footer.label),
                h('span', { className: 'order' }, h(Switch, { checked: state.show[id], onCheckedChange: (value) => toggle(id, value) })),
              ),
            ),
          ),
        )
      }

      /* The app menu. The three-line button opens it; it carries the commands a
         desktop app is expected to have, and the ones this shell can actually
         perform are wired rather than drawn. */
      function MainMenu({ onNew, onToggleRail, onSettings }) {
        const dead = (label, icon) => h(DropdownMenuItem, { key: label }, h(icon), label)
        return h(
          DropdownMenu,
          null,
          h(
            DropdownMenuTrigger,
            { render: h(Button, { variant: 'ghost', size: 'icon-xs', 'aria-label': 'Main menu' }, h(MenuIcon)) },
          ),
          h(
            DropdownMenuContent,
            { align: 'start', sideOffset: 6, className: 'w-52' },
            h(DropdownMenuItem, { onSelect: onNew }, h(SquarePenIcon), 'New chat', h(DropdownMenuShortcut, null, 'Ctrl N')),
            h(DropdownMenuSeparator, null),
            dead('File', FileTextIcon),
            dead('Edit', PencilIcon),
            dead('View', PanelRightIcon),
            dead('Go', ArrowRightIcon),
            h(
              DropdownMenuItem,
              { onSelect: onToggleRail },
              h(SquareStackIcon),
              'Window',
              h(DropdownMenuShortcut, null, 'Ctrl B'),
            ),
            dead('Help', InfoIcon),
            h(DropdownMenuSeparator, null),
            h(DropdownMenuItem, { onSelect: onSettings }, h(SettingsIcon), 'Settings'),
          ),
        )
      }

      /* The rail's header: mode pill plus the icon row. Rendered inside the
         sidebar while it is open and inside the app bar while it is not, so
         collapsing the rail moves its controls somewhere reachable instead of
         off the edge of the screen. The sidebar toggle is not one of them — it
         is rendered once, outside the sidebar, so it cannot vanish with it. */
      function RailHeader({
        variant, setVariant, onToggleRail,
        onNew, onSettings, compact,
        canBack, canForward, onBack, onForward, backTo, forwardTo,
      }) {
        const icon = (label, tip, iconNode, extra) =>
          h(
            Tooltip,
            null,
            h(
              TooltipTrigger,
              { render: h(Button, { variant: 'ghost', size: 'icon-xs', 'aria-label': label, ...extra }, iconNode) },
            ),
            h(TooltipContent, null, tip),
          )

        /* mode pill — the existing header control, relocated, unchanged in shape.
           Switching it swaps the whole rail below, not just a filter. */
        const pill = h(
          ToggleGroup,
          {
            'aria-label': 'Mode',
            size: 'sm',
            value: [variant],
            className: 'gap-0 rounded-[1.625rem] bg-muted/50 p-1',
            onValueChange: (next) => next.length && setVariant(next[0]),
          },
          [
            { value: 'chat', label: 'Chat', icon: MessageCircleIcon },
            { value: 'code', label: 'Code', icon: CodeXmlIcon },
          ].map((option) =>
            h(
              ToggleGroupItem,
              { key: option.value, value: option.value, className: 'rounded-full gap-0 px-2' },
              h('span', { className: 'flex size-4 shrink-0 items-center justify-center [&_svg]:size-4' }, h(option.icon)),
              h(
                'span',
                { className: 'ms-0 grid grid-cols-[0fr] transition-[grid-template-columns] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] motion-reduce:transition-none group-data-pressed/toggle:ms-1.5 group-data-pressed/toggle:grid-cols-[1fr]' },
                h(
                  'span',
                  { className: 'overflow-hidden whitespace-nowrap opacity-0 transition-opacity duration-200 motion-reduce:transition-none group-data-pressed/toggle:opacity-100' },
                  option.label,
                ),
              ),
            ),
          ),
        )

        const menu = h(MainMenu, { onNew, onToggleRail, onSettings })
        const nav = [
          icon('Back', canBack ? `Back to ${navLabel(backTo)}` : 'Back', h(ArrowLeftIcon), {
            disabled: !canBack,
            onClick: onBack,
          }),
          icon('Forward', canForward ? `Forward to ${navLabel(forwardTo)}` : 'Forward', h(ArrowRightIcon), {
            disabled: !canForward,
            onClick: onForward,
          }),
        ]

        /* In the app bar there is one row to fill, so the pill joins it. In the
           rail it gets its own line, under the icons. */
        if (compact) {
          return h('div', { className: 'mock-bar-row' }, menu, pill, h('span', { className: 'grow' }), ...nav)
        }

        return h(
          React.Fragment,
          null,
          h(
            'div',
            /* Clears the fixed toggle, which sits over this corner whether the
               rail is open or not. */
            { className: 'mock-bar-row' },
            menu,
            h('span', { className: 'grow' }),
            ...nav,
          ),
          h('div', { className: 'px-2 pt-1.5' }, pill),
        )
      }

      function Rail({
        variant, setVariant, setView, rail, setRail,
        onToggleRail, onNew, onSettings,
        activeSession, onOpenSession,
        canBack, canForward, onBack, onForward, backTo, forwardTo,
        railOpen,
      }) {
        const set = RAIL_SETS[variant]
        const state = rail[variant]
        const visible = () => state.order.filter((id) => state.show[id])

        const toggle = (id, value) =>
          setRail((all) => ({
            ...all,
            [variant]: {
              ...all[variant],
              show: { ...all[variant].show, [id]: value },
            },
          }))

        const move = (id, delta) =>
          setRail((all) => {
            const order = all[variant].order.slice()
            const index = order.indexOf(id)
            const next = index + delta
            if (index < 0 || next < 0 || next >= order.length) return all
            order.splice(index, 1)
            order.splice(next, 0, id)
            return { ...all, [variant]: { ...all[variant], order } }
          })

        return h(
          Sidebar,
          { collapsible: 'offcanvas', side: 'left' },
          /* Icon toolbar. Every one of these drives real state: the pane
             toggles, search opens the palette, and back/forward walk the
             session history you actually built by clicking rows. */
          h(RailHeader, {
            variant,
            setVariant,
            onToggleRail,
            onNew,
            onSettings,
            canBack,
            canForward,
            onBack,
            onForward,
            backTo,
            forwardTo,
          }),

      /* ---------------------------------------------------------------- composer */
      /* Chat and Code are two different composers, not one composer at two
         sizes. They live in the same PromptInput and swap through AnimatePresence
         regions, each collapsing to height 0 as it leaves — the same structure
         the app uses. */
      const MORPH = {
        duration: duration.morph / 1000,
        ease: easeOut,
      }

      const variantRegion = {
        initial: { height: 0, opacity: 0 },
        animate: { height: 'auto', opacity: 1 },
        exit: { height: 0, opacity: 0 },
      }

      function VariantRegion({ regionKey, active, children }) {
        const ref = React.useRef(null)
        /* AnimatePresence is always mounted, never conditionally. If it were
           only mounted once a region became active it would remember
           `initial={false}` from that first mount and every later switch would
           pop the incoming region in with no animation at all.

           Motion animates height by measuring each frame and opacity through
           the Web Animations API, so both need frames. When they never come —
           a backgrounded tab, a stalled compositor — the animation neither
           advances nor completes and Motion leaves its inline styles behind:
           the region sits at full height and opacity 0, laid out and invisible
           and still taking clicks. So once the morph has had its window plus
           slack, every animation on the node is resolved to its own end state
           rather than the node being torn out from under it. */
        React.useEffect(() => {
          const timer = window.setTimeout(() => {
            const element = ref.current
            if (!element) return
            // A running Web Animations entry wins over inline styles, so
            // clearing them alone is not enough: the node would keep whatever
            // opacity the stalled animation was holding.
            element.getAnimations().forEach((animation) => {
              try {
                animation.finish()
              } catch {
                animation.cancel()
              }
            })
            if (active) {
              // Entering: back to a plain block at its natural size.
              element.style.height = ''
              element.style.opacity = ''
            } else {
              // Leaving: AnimatePresence should already have unmounted it. If
              // it did not, collapse it and take it out of the hit test rather
              // than letting it hold the layout open.
              element.style.height = '0px'
              element.style.opacity = '0'
              element.style.pointerEvents = 'none'
            }
          }, MORPH.duration * 1000 + 250)
          return () => window.clearTimeout(timer)
        }, [active, regionKey])

        return h(
          AnimatePresence,
          { initial: false },
          active
            ? h(
                motion.div,
                { key: regionKey, ref, ...variantRegion, transition: MORPH, style: { overflow: 'hidden' } },
                children,
              )
            : null,
        )
      }

      /* Re-docks the composer when the thread goes from empty to not, so it

      function useDock(ref, docked) {
        const lastTop = React.useRef(null)
        React.useLayoutEffect(() => {
          const element = ref.current
          if (!element) return
          const top = element.getBoundingClientRect().top
          const from = lastTop.current
          lastTop.current = top
          if (from === null || Math.abs(from - top) < 1 || prefersReducedMotion()) return
          element.animate([{ translate: `0 ${from - top}px` }, { translate: '0 0' }], {
            duration: 480,
            easing: easeOut,
          })
        }, [docked, ref])
      }

      function Shell() {
        const [view, setView] = useState('empty')
        const [railOpen, setRailOpen] = useState(true)
        const [variant, setVariant] = useState('code')
        const [mode, setMode] = useState('edit')
        const [model, setModel] = useState(MODELS[0].value)
        const [effort, setEffort] = useState('high')
        const [folder, setFolder] = useState(FOLDERS[0].value)
        /* Chat and Code keep their own row order, their own hidden set and
           their own sessions. One shared list would make them two views of the
           same thing, which is exactly what they are not. */
        const [rail, setRail] = useState(DEFAULT_RAIL_STATE)
        /* Chat and Code each keep their own open conversation. A Chat is not a
           Code session, so opening one must not close the other, and New in one
           mode must not reset the other. */
        const [activeByMode, setActiveByMode] = useState({ chat: null, code: null })
        /* Back and forward walk a history the user builds by clicking rows. They
           are not decoration and not a stub: opening a session pushes onto it,
           and the arrows are disabled only when there is genuinely nowhere to go.
           Per mode, for the same reason the open conversation is. */
        const [navByMode, setNavByMode] = useState({ chat: { stack: [], index: -1 }, code: { stack: [], index: -1 } })
        /* What the user actually typed, per mode. Send appends to it and Start
           a reply flips the composer to its streaming state. */
        const [turnsByMode, setTurnsByMode] = useState({ chat: [], code: [] })
        const [runningByMode, setRunningByMode] = useState({ chat: false, code: false })

        const activeSession = activeByMode[variant]
        const nav = navByMode[variant]
        const running = runningByMode[variant]
        const empty = !activeSession

        function pick(next) {
          setView(next)
          setRailOpen(next !== 'collapsed')
        }

        function openSession(title) {
          setActiveByMode((all) => ({ ...all, [variant]: title }))
          setNavByMode((all) => {
            const current = all[variant]
            const stack = current.stack.slice(0, current.index + 1)
            stack.push(title)
            return { ...all, [variant]: { stack, index: stack.length - 1 } }
          })
        }

        /* New resets the open conversation and nothing else. With none open in
           this mode there is nothing to leave, so it does nothing at all — it
           never conjures an empty chat into existence. */
        function newSession() {
          if (!activeByMode[variant]) return
          setActiveByMode((all) => ({ ...all, [variant]: null }))
          setTurnsByMode((all) => ({ ...all, [variant]: [] }))
          setRunningByMode((all) => ({ ...all, [variant]: false }))
          setNavByMode((all) => {
            const current = all[variant]
            return { ...all, [variant]: { stack: current.stack.slice(0, current.index), index: current.index - 1 } }
          })
        }

        function send(message) {
          const text = message.text.trim()
          if (!text || runningByMode[variant]) return
          setTurnsByMode((all) => ({ ...all, [variant]: [...all[variant], { text, state: 'running' }] }))
          setRunningByMode((all) => ({ ...all, [variant]: true }))
          /* Sending from an empty state opens the thread. The title is the first
             thing said in it — the user's own words, not a name invented for
             them — and it goes on the nav stack so Back has somewhere to go. */
          if (!activeByMode[variant]) {
            openSession(text.length > 42 ? text.slice(0, 42).trimEnd() + '…' : text)
          }
        }

        function stop() {
          setTurnsByMode((all) => ({
            ...all,
            [variant]: all[variant].map((turn) => (turn.state === 'running' ? { ...turn, state: 'stopped' } : turn)),
          }))
          setRunningByMode((all) => ({ ...all, [variant]: false }))
        }

        function back() {
          if (nav.index <= 0) return
          const index = nav.index - 1
          setNavByMode((all) => ({ ...all, [variant]: { ...all[variant], index } }))
          setActiveByMode((all) => ({ ...all, [variant]: all[variant].stack[index] }))
        }

        function forward() {
          if (nav.index >= nav.stack.length - 1) return
          const index = nav.index + 1
          setNavByMode((all) => ({ ...all, [variant]: { ...all[variant], index } }))
          setActiveByMode((all) => ({ ...all, [variant]: all[variant].stack[index] }))
        }

        return h(
          React.Fragment,
          null,
          h(
            SidebarProvider,
            { open: railOpen, onOpenChange: setRailOpen },
            /* The rail is mounted only while it is open. The vendored Sidebar
               asks Tailwind for data-[collapsible=offcanvas] rules to collapse
               itself, and none of those rules are in the build — so it reports
               state="collapsed" while still occupying 256px. Driving the mount
               makes collapse actually collapse. The trigger is a sibling, not a
               child, so it survives either way. */
            railOpen
              ? h(Rail, {
                  variant,
                  setVariant,
                  setView: pick,
                  rail,
                  setRail,
                  onToggleRail: () => setRailOpen((value) => !value),
                  onNew: newSession,
                  onSettings: () => setView('settings'),
                  activeSession,
                  onOpenSession: openSession,
                  canBack: nav.index > 0,
                  canForward: nav.index < nav.stack.length - 1,
                  onBack: back,
                  onForward: forward,
                  backTo: nav.stack[nav.index - 1],
                  forwardTo: nav.stack[nav.index + 1],
                  railOpen,
                })
              : null,
            /* The one sidebar toggle. It is a sibling of Sidebar, not a child,
               so collapsing the rail cannot take it off screen with it.
               `size` has to be stated: the trigger defaults to icon-sm (32px)
               while every icon beside it is icon-xs (24px), which made it hang
               lower and crowd the menu button. */
            h('div', { className: 'mock-rail-toggle' }, h(SidebarTrigger, { size: 'icon-xs' })),
            h(
              SidebarInset,
              null,
              h(
                'div',
                { className: 'mock-body' },
                h(
                  'div',
                  { className: 'mock-col' },
                  h(AppBar, {
                    title: activeSession ?? 'New chat',
                    folder: activeSession ? 'tavi' : 'no folder',
                    running,
                    onPalette: () => setView('palette'),
                    /* When the rail is gone its header moves here, so nothing
                       that used to be one click away becomes unreachable. */
                    header: railOpen
                      ? null
                      : h(RailHeader, {
                          variant,
                          setVariant,
                          compact: true,
                          onToggleRail: () => setRailOpen((value) => !value),
                          onNew: newSession,
                          onSettings: () => setView('settings'),
                          canBack: nav.index > 0,
                          canForward: nav.index < nav.stack.length - 1,
                          onBack: back,
                          onForward: forward,
                          backTo: nav.stack[nav.index - 1],
                          forwardTo: nav.stack[nav.index + 1],
                        }),
                  }),
                  /* Thread, composer and the empty state's trailing spacer are siblings of the
                     app bar, each centring itself the way the app does. The
                     thread's own column is the max-w-3xl inside the scroller,
                     not a wrapper around both. */
                  empty ? h(EmptyState, null) : h(Transcript, { turns: turnsByMode[variant], running }),
                  h(Composer, {
                    empty,
                    running,
                    variant,
                    setMode,
                    mode,
                    setModel,
                    model,
                    setEffort,
                    effort,
                    setFolder,
                    folder,
                    sessions: RAIL_SETS[variant].sessions,
                    activeSession,
                    onOpenSession: openSession,
                    onSubmit: send,
                    onStop: stop,
                  }),
                  empty ? h('div', { key: 'outro', className: 'mock-outro' }) : null,
                ),
              ),
            ),
          ),
          view === 'palette'
            ? h(Palette, {
                sessions: RAIL_SETS[variant].sessions,
                onOpenSession: openSession,
                onNew: newSession,
                onSettings: () => setView('settings'),
                onClose: () => setView(activeSession ? 'thread' : 'empty'),
              })
            : null,
          view === 'settings' ? h(SettingsDialog, { onClose: () => setView('empty') }) : null,
        )
      }

      createRoot(document.getElementById('root')).render(h(Shell))
    </script>
  </body>
</html>
