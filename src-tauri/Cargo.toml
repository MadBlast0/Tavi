[package]
name = "tavi"
version = "0.1.0"
description = "Tavi — a chat and code assistant for the desktop"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tavi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what puts the app in the system tray; `image-png` is what
# decodes the tray's own icon at run time, which is a PNG.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
# Reading and writing the window's remembered geometry. Already in the tree
# through Tauri; named here because this crate uses it directly.
serde_json = "1"
# The provider request. The key stays on this side of the boundary: it is read
# from the credential store, used, and never handed to JavaScript. `rustls`
# rather than the system TLS, so there is nothing to install for the app to
# make a request.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
] }
# Reading the provider's stream, chunk by chunk.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# OS-native credential store: Windows Credential Manager, macOS Keychain,
# libsecret on Linux. Chosen over the first-party stronghold vault because that
# requires a master password just to store an API key.
#
# `crypto-rust` is not optional decoration: without it the crate's Linux
# backend transfers the secret over the D-Bus session bus in the clear, which
# the crate's own source selects explicitly. The bus socket lives in
# `$XDG_RUNTIME_DIR`, which the XDG specification requires to be `0700`, so
# the practical loss is small — but it is a gratuitous downgrade from the
# crate's own posture, and it is one feature flag.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "tokio"] }
font-kit = "0.14.3"
tauri-plugin-dialog = "2.8.3"
# Opening a page in the system's own browser. The webview swallows a new
# window request, so a link to the provider's key page has to be handed to
# the operating system rather than to the app.
tauri-plugin-opener = "2.7.2"
tokio = { version = "1.54.0", features = ["rt", "macros"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
