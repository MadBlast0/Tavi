<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI App</title>
    <script>
      // Runs before the app mounts so dark-mode users never see a light flash.
      // Dark is the default; a stored choice wins. Storage can throw in
      // restricted contexts, so every access is guarded.
      //
      // This is a copy of src/lib/theme.ts, not a use of it: the bundle does
      // not exist yet at this point, and a flash of the wrong theme is exactly
      // what this is here to prevent. The key and the three preferences have to
      // match that module; changing one means changing both.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var preference =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "dark";
          var dark =
            preference === "system"
              ? !window.matchMedia ||
                window.matchMedia("(prefers-color-scheme: dark)").matches
              : preference === "dark";
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();

      // The palette, applied for the same reason and in the same way: the
      // stylesheet selects tokens on `data-palette`, and setting it after the
      // first paint would mean the app is drawn in one palette and then
      // repainted in another.
      //
      // Also a copy of src/lib/palette.ts rather than a use of it, for the
      // reason the script above is. It does not check the value against a list
      // of known ids: an id this build has never heard of matches no palette
      // block, so the base tokens on `:root` apply — which is the default
      // palette. A list here would be a second copy of `PALETTES`, and one
      // that failed to mention a newly added palette would pin the app to the
      // default until the bundle loaded and corrected it, which is a flash of
      // exactly the kind this script exists to prevent.
      (function () {
        try {
          var stored = localStorage.getItem("palette");
          document.documentElement.setAttribute(
            "data-palette",
            stored || "default"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-palette", "default");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
